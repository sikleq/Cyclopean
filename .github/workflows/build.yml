name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest
      - name: Validate data
        run: python tools/validate_data.py
      - name: Build site from committed data
        run: python build_site.py
      - name: Sanity checks
        run: |
          test -f dist/index.html
          test -f dist/tables/heroes.html
          test "$(ls dist/patches | wc -l)" -gt 10
          test "$(wc -c < dist/styles.css)" -lt "$(wc -c < site/styles.css)"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
