name: update-data

# Watch the tracker for new game builds; when one appears, regenerate data/,
# commit it and dispatch `build` (which deploys). The cheap check runs every
# 15 minutes: `git ls-remote` against the last processed tracker commit, no
# clone. Kept separate from the deploy so an outage never blocks publishing.
# GitHub skips most */15 schedules; tools/watch_tracker.ps1 (Windows Task
# Scheduler) dispatches this workflow as a fallback.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild data even if the tracker did not move'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write     # a push by GITHUB_TOKEN does not trigger `build`; we dispatch it

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      head: ${{ steps.cmp.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: data/tracker_head.txt
          sparse-checkout-cone-mode: false
      - id: cmp
        run: |
          head=$(git ls-remote https://github.com/SteamTracking/GameTracking-Deadlock.git HEAD | cut -f1)
          # an outage must not look like "the tracker moved" and start a 90-minute job every 15 minutes
          [ -n "$head" ] || { echo "ls-remote failed"; exit 1; }
          last=$(cat data/tracker_head.txt 2>/dev/null || echo none)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$last" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "tracker moved: $last -> $head"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no new build ($head)"
          fi

  update:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clone tracker
        run: git clone --quiet https://github.com/SteamTracking/GameTracking-Deadlock.git vendor/GameTracking-Deadlock
      - name: Restore predecessor tracker (archived, Jun-Aug 2024)
        id: pre
        uses: actions/cache@v6
        with:
          path: vendor/Deadlocked
          key: deadlocked-archive-v1
      - name: Clone predecessor tracker
        if: steps.pre.outputs.cache-hit != 'true'
        run: git clone --quiet https://github.com/Lifeismana/Deadlocked.git vendor/Deadlocked
      - name: Restore parse cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: parse-json-${{ github.run_id }}
          restore-keys: parse-json-
      - name: Refresh data
        run: python build_site.py --data --no-sync home
      - name: Commit data
        run: |
          git config user.name "cyclopean-bot"
          git config user.email "cyclopean-bot@users.noreply.github.com"
          # the newest GAME build: the tracker's own upkeep commits ("Dump exe…", "Fail…") have no build
          # number and named data commits "tracker Dump" / "tracker Fail" (2026-10-04)
          msg="data: tracker $(git -C vendor/GameTracking-Deadlock log -1 -E --grep='^[0-9]+ ' --format=%s | cut -d' ' -f1)"
          # data/ is generated from the tracker AND the code: when main moved while we ran (a code push,
          # another refresh — run 36896244450 on 2026-10-01 died merging .json.gz files), the answer is
          # to regenerate on top of the new main, never to merge or rebase generated files
          for attempt in 1 2 3; do
            base=$(git rev-parse HEAD)
            git add data
            if git diff --cached --quiet; then
              echo "no new data"
              exit 0
            fi
            git commit -q -m "$msg"
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" = "$base" ]; then
              if git push -q origin HEAD:main 2> push.err; then
                # a tracker commit without game-data changes only moves tracker_head.txt: no redeploy
                if git diff --name-only HEAD~1 HEAD | grep -qv '^data/tracker_head.txt$'; then
                  gh workflow run build.yml --ref main
                fi
                exit 0
              fi
              cat push.err
              # only a race (main moved between fetch and push) is retried; anything else fails now
              grep -qiE 'non-fast-forward|fetch first' push.err || exit 1
              git fetch -q origin main
            fi
            echo "main moved (attempt $attempt): regenerating on top of $(git rev-parse --short origin/main)"
            git reset -q --hard origin/main
            pip install -q -r requirements.txt
            python build_site.py --data --no-sync home
          done
          echo "main kept moving: giving up, the next run picks it up"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
