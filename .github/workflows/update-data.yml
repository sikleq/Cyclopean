name: update-data

# Pull new game builds from the tracker, regenerate data/, commit it.
# The push triggers `build`, which deploys the site. Kept separate from the
# deploy so a tracker/Steam outage never blocks publishing.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # a push by GITHUB_TOKEN does not trigger `build`; we dispatch it

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clone tracker
        run: git clone --quiet https://github.com/SteamTracking/GameTracking-Deadlock.git vendor/GameTracking-Deadlock
      - name: Restore predecessor tracker (archived, Jun-Aug 2024)
        id: pre
        uses: actions/cache@v6
        with:
          path: vendor/Deadlocked
          key: deadlocked-archive-v1
      - name: Clone predecessor tracker
        if: steps.pre.outputs.cache-hit != 'true'
        run: git clone --quiet https://github.com/Lifeismana/Deadlocked.git vendor/Deadlocked
      - name: Restore parse cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: kv3-${{ github.run_id }}
          restore-keys: kv3-
      - name: Refresh data
        run: python build_site.py --data --no-sync home
      - name: Commit data
        run: |
          git config user.name "cyclopean-bot"
          git config user.email "cyclopean-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no new data"
          else
            git commit -m "data: tracker $(git -C vendor/GameTracking-Deadlock log -1 --format=%s | cut -d' ' -f1)"
            git pull --rebase origin main
            git push
            gh workflow run build.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
